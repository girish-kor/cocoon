name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile & import smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Fast, dependency-free gate: every module must compile.
      - name: Compile all sources
        run: python -m compileall -q src

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI entry point loads
        run: cocoon --help

      - name: Config scaffolds and validates
        run: |
          cocoon init
          cocoon config validate

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff
        run: |
          pip install ruff
          ruff check src || true
